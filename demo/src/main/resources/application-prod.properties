spring.application.name=job-consulting-ai

# Database - Using variables provided by Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security
jwt.secret=${JWT_SECRET}

# OpenAI (Memory/Embeddings)
# Dimension MUST be 1536 for text-embedding-3-small
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# Groq (Brain/Chat)
groq.api.key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Infrastructure Fixes
spring.main.allow-bean-definition-overriding=true
spring.ai.openai.embedding.enabled=false
spring.ai.openai.chat.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration,org.springframework.ai.autoconfigure.transformers.TransformersEmbeddingModelAutoConfiguration