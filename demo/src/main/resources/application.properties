spring.application.name=job-consulting-ai

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/job_db
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Ollama - local embeddings only (disabled in prod via env var)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=mxbai-embed-large
spring.ai.ollama.chat.enabled=false

# OpenAI - embeddings in prod
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.enabled=true
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.chat.enabled=false

# Groq - chat only
groq.api.key=${GROQ_API_KEY}

# Vector Store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.main.allow-bean-definition-overriding=true
